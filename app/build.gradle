plugins { id 'com.android.application' }

android {
    namespace 'com.mdebysmn.facestudio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mdebysmn.facestudio'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    // The target phone (Moto Edge 50 Pro) is ARM64. Avoid shipping unused x86/32-bit runtimes.
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a'
            universalApk true
        }
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.30.0'
}
