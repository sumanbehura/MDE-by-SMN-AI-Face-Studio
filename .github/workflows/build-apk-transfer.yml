name: Build APK Transfer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Download models
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 5 -o app/src/main/assets/models/inswapper_128.onnx https://huggingface.co/tsi-org/face-swapper/resolve/main/inswapper_128.onnx
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 5 -o app/src/main/assets/models/det_10g.onnx https://huggingface.co/leonelhs/insightface/resolve/main/det_10g.onnx
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 5 -o app/src/main/assets/models/w600k_r50.onnx https://huggingface.co/leonelhs/insightface/resolve/main/w600k_r50.onnx
          echo "e4a3f08c753cb72d04e10aa0f7dbe3deebbf39567d4ead6dce08e98aa49e16af  app/src/main/assets/models/inswapper_128.onnx" | sha256sum -c -
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Split APK
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-arm64-v8a-debug.apk"
          rm -rf transfer && mkdir transfer
          split -b 90M -d -a 2 "$apk" transfer/MDE-by-SMN-arm64.part-
          sha256sum "$apk" > transfer/MDE-by-SMN-arm64.apk.sha256
      - name: Upload 01
        uses: actions/upload-artifact@v4
        with: {name: MDE-by-SMN-arm64-transfer-01, path: transfer/MDE-by-SMN-arm64.part-00, retention-days: 14, compression-level: 0}
      - name: Upload 02
        uses: actions/upload-artifact@v4
        with: {name: MDE-by-SMN-arm64-transfer-02, path: transfer/MDE-by-SMN-arm64.part-01, retention-days: 14, compression-level: 0}
      - name: Upload 03
        uses: actions/upload-artifact@v4
        with: {name: MDE-by-SMN-arm64-transfer-03, path: transfer/MDE-by-SMN-arm64.part-02, retention-days: 14, compression-level: 0}
      - name: Upload 04
        uses: actions/upload-artifact@v4
        with: {name: MDE-by-SMN-arm64-transfer-04, path: transfer/MDE-by-SMN-arm64.part-03, retention-days: 14, compression-level: 0}
      - name: Upload 05
        uses: actions/upload-artifact@v4
        with: {name: MDE-by-SMN-arm64-transfer-05, path: transfer/MDE-by-SMN-arm64.part-04, retention-days: 14, compression-level: 0}
      - name: Upload 06
        uses: actions/upload-artifact@v4
        with: {name: MDE-by-SMN-arm64-transfer-06, path: transfer/MDE-by-SMN-arm64.part-05, retention-days: 14, compression-level: 0}
      - name: Upload 07
        uses: actions/upload-artifact@v4
        with: {name: MDE-by-SMN-arm64-transfer-07, path: transfer/MDE-by-SMN-arm64.part-06, retention-days: 14, compression-level: 0}
      - name: Upload 08
        uses: actions/upload-artifact@v4
        with: {name: MDE-by-SMN-arm64-transfer-08, path: transfer/MDE-by-SMN-arm64.part-07, retention-days: 14, compression-level: 0}
      - name: Upload 09
        uses: actions/upload-artifact@v4
        with: {name: MDE-by-SMN-arm64-transfer-09, path: transfer/MDE-by-SMN-arm64.part-08, retention-days: 14, compression-level: 0}
      - name: Upload checksum
        uses: actions/upload-artifact@v4
        with: {name: MDE-by-SMN-arm64-transfer-checksum, path: transfer/MDE-by-SMN-arm64.apk.sha256, retention-days: 14, compression-level: 0}
