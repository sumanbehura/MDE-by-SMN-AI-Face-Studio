name: Build Offline APK with InSwapper

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download authorized/selected model files for this build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 5 \
            -o app/src/main/assets/models/inswapper_128.onnx \
            https://huggingface.co/tsi-org/face-swapper/resolve/main/inswapper_128.onnx
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 5 \
            -o app/src/main/assets/models/det_10g.onnx \
            https://huggingface.co/leonelhs/insightface/resolve/main/det_10g.onnx
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 5 \
            -o app/src/main/assets/models/w600k_r50.onnx \
            https://huggingface.co/leonelhs/insightface/resolve/main/w600k_r50.onnx

          echo "Model sizes:"
          ls -lh app/src/main/assets/models

          echo "Verifying InSwapper SHA-256..."
          echo "e4a3f08c753cb72d04e10aa0f7dbe3deebbf39567d4ead6dce08e98aa49e16af  app/src/main/assets/models/inswapper_128.onnx" | sha256sum -c -

      - name: Locate Android SDK
        shell: bash
        run: |
          if [ -d "/usr/local/lib/android/sdk" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH" || true
          fi

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Show APK information
        shell: bash
        run: |
          find app/build/outputs/apk -type f -name '*.apk' -exec ls -lh {} \;
          sha256sum app/build/outputs/apk/**/*.apk 2>/dev/null || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MDE-by-SMN-offline-inswapper-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 90
