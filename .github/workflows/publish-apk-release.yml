name: Build and Publish APK Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download bundled AI models
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/models
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 5 -o app/src/main/assets/models/inswapper_128.onnx https://huggingface.co/tsi-org/face-swapper/resolve/main/inswapper_128.onnx
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 5 -o app/src/main/assets/models/det_10g.onnx https://huggingface.co/leonelhs/insightface/resolve/main/det_10g.onnx
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 5 -o app/src/main/assets/models/w600k_r50.onnx https://huggingface.co/leonelhs/insightface/resolve/main/w600k_r50.onnx
          echo "e4a3f08c753cb72d04e10aa0f7dbe3deebbf39567d4ead6dce08e98aa49e16af  app/src/main/assets/models/inswapper_128.onnx" | sha256sum -c -

      - name: Build ARM64 debug APK
        run: |
          gradle assembleDebug --no-daemon
          test -f app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          ls -lh app/build/outputs/apk/debug/app-arm64-v8a-debug.apk

      - name: Verify APK and calculate checksum
        shell: bash
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-arm64-v8a-debug.apk"
          sha256sum "$apk" | tee apk.sha256
          unzip -t "$apk" >/dev/null
          stat -c "%s" "$apk"

      - name: Publish single APK as GitHub Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="offline-arm64-${GITHUB_RUN_NUMBER}"
          gh release create "$tag"             "app/build/outputs/apk/debug/app-arm64-v8a-debug.apk#MDE-by-SMN-AI-Face-Studio-${tag}.apk"             "apk.sha256#MDE-by-SMN-AI-Face-Studio-${tag}.apk.sha256"             --title "MDE by SMN AI Face Studio — Offline ARM64 $tag"             --notes "Single ARM64 APK with bundled on-device face-swap runtime and models. No backend URL, API key, server, Colab, or runtime model download is required. Use only with authorized model weights and for permitted face-swap use."
