name: Build MDE AI Assistant APK
on:
  workflow_dispatch:
  push:
    paths: ['assistantapp/**','.github/workflows/build-assistant-apk.yml','settings.gradle','build.gradle']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build
        run: gradle :assistantapp:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MDE-AI-Assistant-debug-apk
          path: assistantapp/build/outputs/apk/debug/assistantapp-debug.apk
          retention-days: 14
